name: gvsearch probe
# Temporary: shows what google.com/search returns to a GitHub runner, so the
# GoogleSearchIE parser can be fixed against real pages. Remove after use.
on:
  push:
    branches: ['claude/hopeful-bohr-24s79h']
    paths: ['.github/workflows/gvsearch-probe.yml', 'devscripts/gvsearch_probe.py', 'yt_dlp/extractor/googlesearch.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -q playwright && python3 -m playwright install --with-deps chromium
      - run: xvfb-run -a python3 devscripts/gvsearch_probe.py
      - name: yt-dlp gvsearch (this branch)
        run: |
          python3 -m yt_dlp --flat-playlist --print "%(url)s" -v "gvsearch5:big buck bunny" 2>&1 | tail -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages
          path: probe_out/
